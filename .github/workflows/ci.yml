name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows to match the production environment (tkinter ships with the
    # Windows Python installer; the app runs on department Windows machines)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff — correctness rules)
        run: ruff check .

      - name: Tests (no API, no OCR, no GUI)
        run: python -m unittest discover -s tests -v
